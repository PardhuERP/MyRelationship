<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Together Live Screen</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,Helvetica,sans-serif;
  background:#111;
  color:#fff;
}

.screen{
  position:relative;
  width:100vw;
  height:100vh;
  min-height:620px;
  overflow:hidden;
  background:
    linear-gradient(to bottom,rgba(20,35,50,.35),rgba(20,20,20,.15)),
    url("background.jpg") center/cover no-repeat;
}

/* Dark glass layer only behind the text/widgets */
.screen::before{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(
    to bottom,
    rgba(10,20,30,.20) 0%,
    rgba(10,20,30,.05) 48%,
    rgba(0,0,0,.12) 100%
  );
  pointer-events:none;
}

.content{
  position:relative;
  z-index:2;
  width:100%;
  height:100%;
  padding:32px 18px 18px;
  display:flex;
  flex-direction:column;
  align-items:center;
}

.lock{
  font-size:30px;
  line-height:1;
  margin-top:0;
  margin-bottom:10px;
}

.unlock{
  font-size:20px;
  margin-bottom:10px;
  letter-spacing:.2px;
}

.date{
  font-size:20px;
  margin-bottom:12px;
}

.clock{
  font-size:72px;
  line-height:1;
  font-weight:300;
  letter-spacing:2px;
  margin-bottom:48px;
}

/* TWO MAIN CARDS */
.cards{
  width:100%;
  max-width:760px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.card{
  min-height:178px;
  padding:25px 12px 18px;
  border:1px solid rgba(255,255,255,.30);
  border-radius:38px;
  background:rgba(70,78,90,.48);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  text-align:center;
  box-shadow:0 8px 25px rgba(0,0,0,.08);
}

.card-title{
  font-size:21px;
  margin-bottom:25px;
  white-space:nowrap;
}

.heart{
  color:#ff2f6d;
  font-size:27px;
  margin-right:8px;
}

.big-duration{
  font-size:38px;
  line-height:1.05;
  font-weight:700;
  white-space:nowrap;
}

.since{
  font-size:16px;
  margin-top:18px;
  opacity:.95;
}

/* LIVE D/H/M/S CARD */
.live-values{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:5px;
  margin-top:2px;
}

.live-number{
  font-size:34px;
  line-height:1;
  font-weight:700;
}

.live-label{
  font-size:13px;
  margin-top:13px;
  opacity:.9;
}

/* QUOTE */
.quote{
  width:90%;
  max-width:700px;
  margin-top:0;
  min-height:86px;
  padding:18px 20px;
  border:1px solid rgba(255,255,255,.28);
  border-radius:45px;
  background:rgba(80,80,80,.40);
  backdrop-filter:blur(9px);
  -webkit-backdrop-filter:blur(9px);
  text-align:center;
  font-size:21px;
  line-height:1.35;
  letter-spacing:5px;
}

/* BOTTOM CARDS */
.bottom{
  width:100%;
  max-width:760px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-top:auto;
}

.bottom-card{
  min-height:145px;
  padding:22px 10px;
  border-radius:30px;
  background:rgba(25,25,25,.70);
  text-align:center;
  box-shadow:0 8px 25px rgba(0,0,0,.20);
}

.bottom-title{
  font-size:17px;
  margin-bottom:8px;
}

.bottom-number{
  font-size:36px;
  font-weight:700;
  margin-bottom:5px;
}

.bottom-sub{
  font-size:17px;
}

/* EDIT BUTTON */
.edit{
  position:absolute;
  z-index:5;
  right:18px;
  bottom:18px;
  width:66px;
  height:66px;
  border:0;
  border-radius:50%;
  background:rgba(25,25,25,.75);
  color:white;
  font-size:30px;
}

/* SETTINGS PANEL */
.settings{
  display:none;
  position:absolute;
  z-index:20;
  inset:0;
  padding:25px;
  background:rgba(0,0,0,.88);
  overflow:auto;
}

.settings.show{display:block}

.settings-box{
  max-width:500px;
  margin:auto;
  padding:24px;
  border-radius:24px;
  background:#222;
}

.settings h2{margin-top:0}

.settings label{
  display:block;
  margin:14px 0 6px;
}

.settings input{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:1px solid #555;
  background:#111;
  color:#fff;
}

.settings button{
  margin-top:18px;
  padding:12px 18px;
  border:0;
  border-radius:12px;
  cursor:pointer;
}

@media(max-width:430px){
  .content{padding:25px 12px 14px}
  .lock{font-size:28px}
  .unlock,.date{font-size:18px}
  .clock{font-size:66px;margin-bottom:38px}

  .card{
    min-height:170px;
    border-radius:34px;
    padding:23px 7px 16px;
  }

  .card-title{font-size:19px;margin-bottom:25px}
  .big-duration{font-size:35px}
  .since{font-size:15px}

  .live-number{font-size:30px}
  .live-label{font-size:12px}

  .quote{
    width:94%;
    font-size:18px;
    letter-spacing:4px;
    min-height:78px;
  }

  .bottom-card{
    min-height:135px;
    border-radius:28px;
  }

  .bottom-number{font-size:34px}
}

@media(max-height:750px){
  .clock{margin-bottom:28px;font-size:60px}
  .card{min-height:150px;padding-top:18px}
  .card-title{margin-bottom:18px}
  .quote{min-height:65px;padding:13px}
  .bottom-card{min-height:110px;padding:15px}
}
</style>
</head>

<body>

<div class="screen">

  <div class="content">

    <div class="lock">🔒</div>
    <div class="unlock">Look down to unlock</div>

    <div class="date" id="todayDate">Mon, 21 Sept 2026</div>

    <!-- LIVE PHONE CLOCK -->
    <div class="clock" id="clock">13:44</div>

    <div class="cards">

      <!-- CARD 1: YEARS / MONTHS / DAYS -->
      <div class="card">
        <div class="card-title">
          <span class="heart">♥</span> together for
        </div>

        <div class="big-duration" id="calendarDuration">
          2y, 8m, 6d
        </div>

        <div class="since">
          Since <span id="sinceDate">15 Jan 2024</span>
        </div>
      </div>

      <!-- CARD 2: LIVE DAYS/HOURS/MIN/SEC -->
      <div class="card">
        <div class="card-title">
          <span class="heart">♥</span> together for
        </div>

        <div class="live-values">

          <div>
            <div class="live-number" id="days">980</div>
            <div class="live-label">D</div>
          </div>

          <div>
            <div class="live-number" id="hours">01</div>
            <div class="live-label">H</div>
          </div>

          <div>
            <div class="live-number" id="minutes">13</div>
            <div class="live-label">Min</div>
          </div>

          <div>
            <div class="live-number" id="seconds">30</div>
            <div class="live-label">Sec</div>
          </div>

        </div>
      </div>

    </div>

    <div class="quote">
      ♥ &nbsp; S a m e &nbsp; P e o p l e &nbsp; S a m e &nbsp; D r e a m s<br>
      A l w a y s &nbsp; U s
    </div>

    <div class="bottom">

      <div class="bottom-card">
        <div class="bottom-title">Next Anniversary</div>
        <div class="bottom-number" id="nextDays">116 Days</div>
        <div class="bottom-sub" id="nextDate">15 Jan 2027</div>
      </div>

      <div class="bottom-card">
        <div class="bottom-title">♥</div>
        <div class="bottom-number">Together</div>
        <div class="bottom-sub">and counting...</div>
      </div>

    </div>

  </div>

  <button class="edit" onclick="openSettings()">✎</button>

  <div class="settings" id="settings">
    <div class="settings-box">
      <h2>Edit Together Screen</h2>

      <label>Start date & time</label>
      <input id="startInput" type="datetime-local">

      <label>Quote line 1</label>
      <input id="quote1" value="♥  S a m e  P e o p l e  S a m e  D r e a m s">

      <label>Quote line 2</label>
      <input id="quote2" value="A l w a y s  U s">

      <label>Background image</label>
      <input id="bgInput" type="file" accept="image/*">

      <button onclick="saveSettings()">Save</button>
      <button onclick="closeSettings()">Close</button>
    </div>
  </div>

</div>

<script>
/* ==========================================================
   SETTINGS
   ========================================================== */

let startDate = new Date("2024-01-15T00:00:00");

function loadSettings(){
  const saved = localStorage.getItem("togetherStart");
  if(saved){
    startDate = new Date(saved);
  }

  const q1 = localStorage.getItem("quote1");
  const q2 = localStorage.getItem("quote2");

  if(q1) document.querySelector(".quote").innerHTML =
    "♥ &nbsp; " + q1.replaceAll(" ","&nbsp;") + "<br>" +
    (q2 ? q2.replaceAll(" ","&nbsp;") : "A l w a y s &nbsp; U s");

  if(q2 && !q1) document.querySelector(".quote").innerHTML =
    "♥ &nbsp; S a m e &nbsp; P e o p l e &nbsp; S a m e &nbsp; D r e a m s<br>" +
    q2.replaceAll(" ","&nbsp;");

  const bg = localStorage.getItem("backgroundImage");
  if(bg){
    document.querySelector(".screen").style.backgroundImage =
      'linear-gradient(to bottom,rgba(20,35,50,.35),rgba(20,20,20,.15)),url("' +
      bg + '")';
  }
}

/* ==========================================================
   LIVE CLOCK
   ========================================================== */

function updateClock(){

  const now = new Date();

  const hh = String(now.getHours()).padStart(2,"0");
  const mm = String(now.getMinutes()).padStart(2,"0");
  const ss = String(now.getSeconds()).padStart(2,"0");

  document.getElementById("clock").textContent =
    hh + ":" + mm;

  const dateText = now.toLocaleDateString("en-GB",{
    weekday:"short",
    day:"2-digit",
    month:"short",
    year:"numeric"
  });

  document.getElementById("todayDate").textContent =
    dateText;

  updateTogether(now);
}

/* ==========================================================
   LIVE TOGETHER COUNTER
   ========================================================== */

function updateTogether(now){

  let diff = now.getTime() - startDate.getTime();

  if(diff < 0) diff = 0;

  const totalSeconds = Math.floor(diff / 1000);

  const days = Math.floor(totalSeconds / 86400);
  const hours = Math.floor((totalSeconds % 86400) / 3600);
  const minutes = Math.floor((totalSeconds % 3600) / 60);
  const seconds = totalSeconds % 60;

  /* SECOND CARD */
  document.getElementById("days").textContent =
    days;

  document.getElementById("hours").textContent =
    String(hours).padStart(2,"0");

  document.getElementById("minutes").textContent =
    String(minutes).padStart(2,"0");

  document.getElementById("seconds").textContent =
    String(seconds).padStart(2,"0");

  /* FIRST CARD: calendar years/months/days */
  let y = now.getFullYear() - startDate.getFullYear();
  let m = now.getMonth() - startDate.getMonth();
  let d = now.getDate() - startDate.getDate();

  if(d < 0){
    m--;
    const previousMonth =
      new Date(now.getFullYear(),now.getMonth(),0);
    d += previousMonth.getDate();
  }

  if(m < 0){
    y--;
    m += 12;
  }

  document.getElementById("calendarDuration").textContent =
    y + "y, " + m + "m, " + d + "d";

  document.getElementById("sinceDate").textContent =
    startDate.toLocaleDateString("en-GB",{
      day:"2-digit",
      month:"short",
      year:"numeric"
    });

  /* NEXT ANNIVERSARY */
  let next = new Date(
    now.getFullYear(),
    startDate.getMonth(),
    startDate.getDate()
  );

  if(next <= now){
    next.setFullYear(next.getFullYear()+1);
  }

  const daysToNext =
    Math.ceil((next-now)/(1000*60*60*24));

  document.getElementById("nextDays").textContent =
    daysToNext + " Days";

  document.getElementById("nextDate").textContent =
    next.toLocaleDateString("en-GB",{
      day:"2-digit",
      month:"short",
      year:"numeric"
    });
}

/* ==========================================================
   SETTINGS UI
   ========================================================== */

function openSettings(){
  document.getElementById("settings").classList.add("show");

  const local =
    new Date(startDate.getTime() -
    startDate.getTimezoneOffset()*60000)
    .toISOString()
    .slice(0,16);

  document.getElementById("startInput").value = local;
}

function closeSettings(){
  document.getElementById("settings").classList.remove("show");
}

function saveSettings(){

  const value =
    document.getElementById("startInput").value;

  if(value){
    startDate = new Date(value);
    localStorage.setItem(
      "togetherStart",
      startDate.toISOString()
    );
  }

  const q1 =
    document.getElementById("quote1").value;

  const q2 =
    document.getElementById("quote2").value;

  localStorage.setItem("quote1",q1);
  localStorage.setItem("quote2",q2);

  document.querySelector(".quote").innerHTML =
    "♥ &nbsp; " + q1.replaceAll(" ","&nbsp;") +
    "<br>" +
    q2.replaceAll(" ","&nbsp;");

  const file =
    document.getElementById("bgInput").files[0];

  if(file){
    const reader = new FileReader();

    reader.onload = function(e){
      localStorage.setItem(
        "backgroundImage",
        e.target.result
      );

      document.querySelector(".screen").style.backgroundImage =
        'linear-gradient(to bottom,rgba(20,35,50,.35),rgba(20,20,20,.15)),url("' +
        e.target.result + '")';
    };

    reader.readAsDataURL(file);
  }

  closeSettings();
}

/* ==========================================================
   START
   ========================================================== */

loadSettings();
updateClock();
setInterval(updateClock,1000);

</script>

</body>
</html>
